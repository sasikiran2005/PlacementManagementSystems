<template>

    <lightning-card title={job.Name}>

        <div class="slds-p-around_medium">

            <p class="slds-m-bottom_small">
                <strong>Status:</strong>
                {job.Status__c}
            </p>

            <p class="slds-m-bottom_small">
                <strong>Minimum CGPA:</strong>
                {job.Minimum_CGPA__c}
            </p>

            <p class="slds-m-bottom_small">
                <strong>Eligible Branch:</strong>
                {job.Eligible_Branch__c}
            </p>

            <p class="slds-m-bottom_medium">
                <strong>Deadline:</strong>
                {job.Last_Date__c}
            </p>

            <div class="slds-grid slds-gutters">

                <!-- View Details -->
                <div class="slds-col">
                    <lightning-button
                        label="View Details"
                        data-job-id={job.Id}
                        onclick={handleViewDetails}>
                    </lightning-button>
                </div>

                <!-- Apply -->
                <div class="slds-col">

                    <lightning-button
                        variant="brand"
                        label={buttonLabel}
                        data-job-id={job.Id}
                        onclick={handleApply}
                        disabled={isApplying}>
                    </lightning-button>

                </div>

            </div>

        </div>

    </lightning-card>

</template>
